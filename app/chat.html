<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itinerary Maker Chat</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1d2733;
      --muted: #5a6a7b;
      --accent: #0b6bcb;
      --accent-hover: #0956a5;
      --border: #d7e0ea;
      --success: #0a7f39;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--bg), #edf2f8);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(21, 39, 63, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    textarea,
    button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      padding: 10px 12px;
    }

    textarea {
      resize: vertical;
      min-height: 130px;
    }

    button {
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    button:disabled {
      background: #9fb3ca;
      cursor: not-allowed;
    }

    button:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .status {
      margin-top: 12px;
      min-height: 24px;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--error);
    }

    .history {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .history h2 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }

    .history-note {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .history-list {
      display: grid;
      gap: 10px;
      max-height: 300px;
      overflow: auto;
      padding-right: 6px;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #f9fbff;
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .history-preview {
      margin: 0;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-toggle {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--accent);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: auto;
    }

    .history-toggle:hover {
      background: #eef5fe;
    }

    .history-item-details {
      margin-top: 10px;
    }

    .history-item-details.hidden {
      display: none;
    }

    .history-item p {
      margin: 0;
      color: var(--text);
    }

    .history-item p + p {
      margin-top: 8px;
    }

    .history-label {
      font-weight: 700;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ask Itinerary Maker</h1>
    <p>Enter your username and a question, then click Ask.</p>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="e.g. scott" />
    </div>

    <div class="field">
      <label for="message">Question</label>
      <textarea id="message" name="message" placeholder="Give the chatbot details about your itinerary request..."></textarea>
    </div>

    <button id="askBtn" type="button" disabled>Ask</button>
    <div id="status" class="status"></div>

    <section class="history" aria-live="polite">
      <h2>Previous Questions</h2>
      <p id="historyNote" class="history-note">Type at least 5 characters in username to load history.</p>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <script>
    const usernameInput = document.getElementById("username");
    const messageInput = document.getElementById("message");
    const askBtn = document.getElementById("askBtn");
    const statusEl = document.getElementById("status");
    const historyNoteEl = document.getElementById("historyNote");
    const historyListEl = document.getElementById("historyList");

    let historyDebounceTimer = null;

    function hasText(value) {
      return value.trim().length > 0;
    }

    function updateButtonState() {
      const isEnabled = hasText(usernameInput.value) && hasText(messageInput.value);
      askBtn.disabled = !isEnabled;
    }

    function clearHistoryList() {
      historyListEl.innerHTML = "";
    }

    function renderHistory(items) {
      clearHistoryList();

      if (!Array.isArray(items) || items.length === 0) {
        historyNoteEl.textContent = "No history found for this user yet.";
        return;
      }

      historyNoteEl.textContent = `Loaded ${items.length} previous item${items.length === 1 ? "" : "s"}.`;

      for (const item of items) {
        const wrapper = document.createElement("article");
        wrapper.className = "history-item";

        const header = document.createElement("div");
        header.className = "history-item-header";
        header.setAttribute("tabindex", "0");

        const preview = document.createElement("p");
        preview.className = "history-preview";
        const firstQuestionLine = (item.question ?? "").split(/\r?\n/)[0] || "(No question)";
        preview.textContent = firstQuestionLine;

        const toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = "history-toggle";
        toggleBtn.textContent = "Show all";
        toggleBtn.setAttribute("aria-expanded", "false");

        header.append(preview, toggleBtn);

        const question = document.createElement("p");
        const questionLabel = document.createElement("span");
        questionLabel.className = "history-label";
        questionLabel.textContent = "Q:";
        question.append(questionLabel, document.createTextNode(item.question ?? ""));

        const answer = document.createElement("p");
        const answerLabel = document.createElement("span");
        answerLabel.className = "history-label";
        answerLabel.textContent = "A:";
        answer.append(answerLabel, document.createTextNode(item.answer ?? ""));

        const details = document.createElement("div");
        details.className = "history-item-details hidden";
        details.append(question, answer);

        function toggleItem() {
          const isHidden = details.classList.contains("hidden");

          if (isHidden) {
            const openDetails = historyListEl.querySelectorAll(".history-item-details:not(.hidden)");
            for (const openDetail of openDetails) {
              openDetail.classList.add("hidden");
            }

            const expandedButtons = historyListEl.querySelectorAll('.history-toggle[aria-expanded="true"]');
            for (const expandedButton of expandedButtons) {
              expandedButton.textContent = "Show all";
              expandedButton.setAttribute("aria-expanded", "false");
            }
          }

          details.classList.toggle("hidden", !isHidden);
          toggleBtn.textContent = isHidden ? "Shrink" : "Show all";
          toggleBtn.setAttribute("aria-expanded", isHidden ? "true" : "false");
        }

        toggleBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleItem();
        });

        header.addEventListener("click", (event) => {
          if (event.target.closest("button")) {
            return;
          }

          toggleItem();
        });

        header.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") {
            return;
          }

          event.preventDefault();
          toggleItem();
        });

        wrapper.append(header, details);
        historyListEl.appendChild(wrapper);
      }
    }

    async function fetchHistory(username) {
      if (username.length < 5) {
        clearHistoryList();
        historyNoteEl.textContent = "Type at least 5 characters in username to load history.";
        return;
      }

      historyNoteEl.textContent = "Loading history...";

      try {
        const response = await fetch("/api/v1/chat/history", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ username }),
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const errorMessage = data?.detail || `Request failed (${response.status}).`;
          throw new Error(errorMessage);
        }

        renderHistory(data.history);
      } catch (error) {
        clearHistoryList();
        historyNoteEl.textContent = `Failed to load history: ${error.message}`;
      }
    }

    function scheduleHistoryFetch() {
      if (historyDebounceTimer) {
        window.clearTimeout(historyDebounceTimer);
      }

      historyDebounceTimer = window.setTimeout(() => {
        fetchHistory(usernameInput.value.trim());
      }, 300);
    }

    async function askQuestion() {
      if (askBtn.disabled) {
        return;
      }

      const payload = {
        username: usernameInput.value.trim(),
        message: messageInput.value.trim(),
      };

      askBtn.disabled = true;
      statusEl.className = "status";
      statusEl.textContent = "Sending request...";

      try {
        const response = await fetch("/api/v1/chat/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const errorMessage = data?.detail || `Request failed (${response.status}).`;
          throw new Error(errorMessage);
        }

        statusEl.className = "status success";
        const responseText = data.response ?? "(No response field returned)";
        statusEl.textContent = `Response:\n${responseText}`;

        if (data.ics_download_url) {
          const link = document.createElement("a");
          link.href = data.ics_download_url;
          link.textContent = "Download itinerary calendar (.ics)";
          link.style.display = "inline-block";
          link.style.marginTop = "10px";
          link.style.fontWeight = "600";
          link.setAttribute("download", "itinerary.ics");
          statusEl.appendChild(document.createElement("br"));
          statusEl.appendChild(link);
        }

        fetchHistory(payload.username);
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = `Error: ${error.message}`;
      } finally {
        updateButtonState();
      }
    }

    usernameInput.addEventListener("input", () => {
      updateButtonState();
      scheduleHistoryFetch();
    });
    messageInput.addEventListener("input", updateButtonState);
    askBtn.addEventListener("click", askQuestion);
  </script>
</body>
</html>
